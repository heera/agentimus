name: integration

# Boots the plugin inside REAL WordPress + MySQL (WP_UnitTestCase) so the seams the
# fast `ci` unit suite has to stub — dbDelta, raw $wpdb, REST dispatch, rewrite
# routing, real escaping, cron — are exercised for real. Slower than `ci`; `ci` stays
# the quick gate, this is the thorough one.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration · PHP ${{ matrix.php }} · WP ${{ matrix.wp }}${{ matrix.multisite && ' · multisite' || '' }}
    runs-on: ubuntu-latest
    # ⛔ A ceiling on the whole job: GitHub's default is SIX HOURS, which is how a
    # stuck runner held a release hostage on 2026-08-19. The suite itself takes
    # about four minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor ("Requires at least: 6.0") on the PHP floor.
          - php: '7.4'
            wp: '6.0'
          - php: '7.4'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
            multisite: '1'
          # The versions that deprecate what older PHP accepts silently.
          - php: '8.4'
            wp: 'latest'
          - php: '8.5'
            wp: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # ⭐ The service makes the test database itself, on startup. That is the
          # whole reason this job no longer installs a MySQL client: the only
          # thing the old one did was `mysqladmin create`. PHP talks to the
          # server over mysqli, which setup-php already provides.
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      # ⛔ NOTHING IS INSTALLED FROM apt HERE, and nothing should be added back.
      # This job used to fetch Subversion (to export the WP test library) and a
      # MySQL client (to create the test DB), and that step is where the runners
      # actually failed: on 2026-08-19 three jobs of six sat in apt for 32 minutes
      # while their siblings finished the WHOLE run in two, and an earlier job that
      # night sat there four hours before it was cancelled. It was never the tests.
      # Both needs were removed instead of bounded — the test library comes down as
      # a tarball (bin/install-wp-tests.sh) and the MySQL service creates its own
      # database (MYSQL_DATABASE above, with skip-db-create below).
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install the WordPress test suite
        # The trailing `true` is skip-db-create — the service container already
        # made wordpress_test, and creating it here would want a MySQL client.
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }} true

      - name: Run integration tests
        run: composer test:integration
        env:
          WP_MULTISITE: ${{ matrix.multisite }}
