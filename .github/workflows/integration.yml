name: integration

# Boots the plugin inside REAL WordPress + MySQL (WP_UnitTestCase) so the seams the
# fast `ci` unit suite has to stub — dbDelta, raw $wpdb, REST dispatch, rewrite
# routing, real escaping, cron — are exercised for real. Slower than `ci`; `ci` stays
# the quick gate, this is the thorough one.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration · PHP ${{ matrix.php }} · WP ${{ matrix.wp }}${{ matrix.multisite && ' · multisite' || '' }}
    runs-on: ubuntu-latest
    # ⛔ A ceiling on the whole job: GitHub's default is SIX HOURS, which is how a
    # stuck runner held a release hostage on 2026-08-19. The suite itself takes
    # about four minutes.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor ("Requires at least: 6.0") on the PHP floor.
          - php: '7.4'
            wp: '6.0'
          - php: '7.4'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
            multisite: '1'
          # The versions that deprecate what older PHP accepts silently.
          - php: '8.4'
            wp: 'latest'
          - php: '8.5'
            wp: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest no longer ships Subversion (used to export the WP test library)
      # or a MySQL client (used to create the test DB) — install both.
      #
      # ⚠️ WRAPPED IN A TIMEOUT AND RETRIED, because this step is where the runners
      # actually fail. 2026-08-19: three jobs of six sat in apt for 32 minutes while
      # their siblings finished the WHOLE run in two — and an earlier job that night
      # sat there four hours before it was cancelled. It is always this step, never
      # the tests, and an unbounded apt turns a mirror hiccup into a blocked release.
      # ⭐ Four minutes then start again: a bad mirror costs seconds, and a runner
      # that is truly broken fails the job in twelve minutes instead of hanging until
      # GitHub's six-hour ceiling.
      - name: Install system dependencies
        timeout-minutes: 13
        run: |
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if timeout 240 sudo apt-get update -qq \
               && timeout 240 sudo apt-get install -y --no-install-recommends subversion default-mysql-client; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt did not finish in time — retrying"
            sleep 10
          done
          echo "::error::apt failed three times; this is the runner, not the plugin"
          exit 1

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run integration tests
        run: composer test:integration
        env:
          WP_MULTISITE: ${{ matrix.multisite }}
