name: integration

# Boots the plugin inside REAL WordPress + MySQL (WP_UnitTestCase) so the seams the
# fast `ci` unit suite has to stub — dbDelta, raw $wpdb, REST dispatch, rewrite
# routing, real escaping, cron — are exercised for real. Slower than `ci`; `ci` stays
# the quick gate, this is the thorough one.

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Integration · PHP ${{ matrix.php }} · WP ${{ matrix.wp }}${{ matrix.multisite && ' · multisite' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The declared floor ("Requires at least: 6.0") on the PHP floor.
          - php: '7.4'
            wp: '6.0'
          - php: '7.4'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
          - php: '8.2'
            wp: 'latest'
            multisite: '1'
          # The versions that deprecate what older PHP accepts silently.
          - php: '8.4'
            wp: 'latest'
          - php: '8.5'
            wp: 'latest'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      # ubuntu-latest no longer ships Subversion (used to export the WP test library)
      # or a MySQL client (used to create the test DB) — install both.
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends subversion default-mysql-client

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          tools: composer
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install the WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1:3306 ${{ matrix.wp }}

      - name: Run integration tests
        run: composer test:integration
        env:
          WP_MULTISITE: ${{ matrix.multisite }}
