name: Deploy to WordPress.org

# Publishes a release to the WordPress.org plugin directory via SVN.
#
# Trigger: push a tag that matches the version, with NO "v" prefix
# (e.g. `git tag 1.0.0 && git push origin 1.0.0`). The tag name becomes the
# SVN tag directory, so it MUST equal the `Stable tag` in readme.txt.
#
# Build steps are mandatory here: assets/admin/ (the compiled Vue app) AND
# vendor/ (the bundled MCP Adapter + Jetpack autoloader) are gitignored, so a
# bare checkout has neither. We rebuild both into the workspace — vendor via
# `composer install --no-dev`, so ONLY production deps land — then the 10up
# action rsyncs the tree honoring .distignore: the fresh build and the trimmed
# vendor ship, node_modules/tests/dev-tooling do not.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build admin UI (regenerates assets/admin/)
        run: |
          npm ci
          npm run build

      - name: Fail if the build produced nothing
        run: test -s assets/admin/app.js && test -s assets/admin/app.css

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # 7.4 = the plugin's floor; also honors composer.json's platform pin.
          php-version: '7.4'
          tools: composer

      - name: Install runtime PHP dependencies (vendor/ ships in the zip)
        run: composer install --no-dev --prefer-dist --no-progress --optimize-autoloader

      - name: Fail if the MCP adapter vendor tree is incomplete
        run: |
          test -f vendor/autoload_packages.php
          test -f vendor/composer/jetpack_autoload_classmap.php
          test -d vendor/wordpress/mcp-adapter/includes

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: agentimus
          # ASSETS_DIR defaults to .wordpress-org (icon, banner, screenshots).
