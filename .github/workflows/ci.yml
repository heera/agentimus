name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is what production runs; 8.2 is the common modern host. 8.4 and 8.5
        # are here because that is where PHP started deprecating things we were
        # doing — implicitly nullable parameters shipped unnoticed precisely
        # because no job in this matrix could see them.
        php: ['7.4', '8.2', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run unit tests
        run: composer test
