<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../assets/admin/app.css">
<style>
  /* Approximate the wp-admin content context the app is styled against. */
  html, body { margin: 0; padding: 0; background: #f0f0f1; -webkit-font-smoothing: antialiased; }
  #wpwrap { background: #f0f0f1; }
  #wpcontent { padding-left: 20px; box-sizing: border-box; }
  .wrap { margin: 10px 20px 0 2px; }
</style>
<script src="./data.js"></script>
<script>
  // The admin app fetches a few REST endpoints at runtime; serve canned data so a
  // static render looks alive (only /activity is hit on initial load — Dashboard).
  // Canned Agent access feed for the #agent-access shot: a spread that shows the feature's range —
  // a brand-new application password (NEW pill + revoke line), a rolled-up ability, a first use, a
  // credentialed refusal (the "a key you issued tried something it isn't allowed to" line), and an
  // older key. coverage:'full' draws the green WATCHING box; passwords:true hides the HTTPS notice.
  window.__AGENT_ACCESS__ = {
    events: [
      { id: 5, kind: 'apppw_created', userId: 1, cred: '43a19c82-ebef-44dd-afb2-cd77c246d052', subject: 'Zapier', detail: '', hits: 1, firstSeen: '2026-07-12T09:41:00+00:00', lastSeen: '2026-07-12T09:41:00+00:00', seen: false },
      { id: 4, kind: 'ability_used', userId: 1, cred: '', subject: 'agentimus/read-readiness', detail: 'hook', hits: 3, firstSeen: '2026-07-12T08:10:00+00:00', lastSeen: '2026-07-12T09:05:00+00:00', seen: true },
      { id: 3, kind: 'apppw_used', userId: 1, cred: '9f0c-…-2a1b', subject: 'n8n workflow', detail: '', hits: 1, firstSeen: '2026-07-11T16:22:00+00:00', lastSeen: '2026-07-11T16:22:00+00:00', seen: true },
      { id: 2, kind: 'ability_refused', userId: 1, cred: 'c3d4-…-88fe', subject: 'agentimus/scan-exposed-files', detail: '403', hits: 1, firstSeen: '2026-07-11T14:03:00+00:00', lastSeen: '2026-07-11T14:03:00+00:00', seen: true },
      { id: 1, kind: 'apppw_created', userId: 1, cred: 'old-laptop-uuid', subject: 'Old laptop', detail: '', hits: 1, firstSeen: '2026-07-09T11:47:00+00:00', lastSeen: '2026-07-09T11:47:00+00:00', seen: true },
    ],
    unseen: 1, total: 5, hasMore: false, cursor: null, perPage: 100,
    coverage: 'full', hasAbilities: true, thirdParty: true, passwords: true, wpVersion: '7.0.1',
    retention: 90, maxRows: 5000,
  };

  // Canned edge summary for the Request-Log tab's "At the Edge" cards: totals that
  // don't quite match (blocked + cached + origin < requests is realistic — Cloudflare
  // samples), one crawler the owner blocks that keeps knocking (fills the conduct
  // list), three companies for the bytes bars. Mirrors inc/Cloudflare/Summary.php.
  window.__EDGE__ = {
    connected: true, zoneName: 'example.com', lastError: '', days: 7,
    totals: { requests: 743, cached: 81, origin: 646, blocked: 16, bytes: 96468992 },
    crawlers: [
      { ua: 'claude-searchbot', name: 'Claude-SearchBot', operator: 'Anthropic', requests: 250, cached: 45, origin: 205, blocked: 0, bytes: 41943040, blockedByYou: false },
      { ua: 'perplexitybot', name: 'PerplexityBot', operator: 'Perplexity', requests: 139, cached: 10, origin: 129, blocked: 0, bytes: 23068672, blockedByYou: false },
      { ua: 'chatgpt-user', name: 'ChatGPT-User', operator: 'OpenAI', requests: 187, cached: 14, origin: 173, blocked: 0, bytes: 19922944, blockedByYou: false },
      { ua: 'gptbot', name: 'GPTBot', operator: 'OpenAI', requests: 110, cached: 12, origin: 82, blocked: 16, bytes: 10485760, blockedByYou: false },
      { ua: 'bytespider', name: 'Bytespider', operator: 'ByteDance', requests: 57, cached: 0, origin: 57, blocked: 0, bytes: 1048576, blockedByYou: true },
    ],
    companies: [
      { operator: 'Anthropic', requests: 250, bytes: 41943040 },
      { operator: 'OpenAI', requests: 297, bytes: 30408704 },
      { operator: 'Perplexity', requests: 139, bytes: 23068672 },
      { operator: 'ByteDance', requests: 57, bytes: 1048576 },
    ],
    conflicts: [],
    dashUrl: 'https://dash.cloudflare.com/?to=/:account/example.com/security/bots',
  };

  // Canned Request-Log page: one row per status kind (unchecked script, verified
  // crawler, spoofed claimant, refused claimant) so the card mode shows its range.
  window.__LOG__ = {
    rows: [
      { agent: 'Agentimus/1.32.0 self-check', verdict: 0, refused: false, signer: '', endpoint: 'oauth-authorization-server', network: '', ua: 'Agentimus/1.32.0 self-check', at: '2026-07-31T14:07:00+00:00' },
      { agent: 'ChatGPT-User', verdict: 1, refused: false, signer: '', endpoint: 'markdown', network: 'OpenAI', ua: 'Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; ChatGPT-User/1.0; +https://openai.com/bot', at: '2026-07-31T13:44:00+00:00' },
      { agent: 'Claude-SearchBot', verdict: 2, refused: false, signer: '', endpoint: 'llms.txt', network: '', ua: 'Mozilla/5.0 (compatible; Claude-SearchBot/1.0; +https://www.anthropic.com)', at: '2026-07-31T11:29:00+00:00' },
      { agent: 'GPTBot', verdict: 0, refused: true, signer: '', endpoint: 'markdown', network: '', ua: 'Mozilla/5.0 (compatible; GPTBot/1.2; +https://openai.com/gptbot)', at: '2026-07-30T17:12:00+00:00' },
    ],
    total: 4, hasMore: false, cursor: null, retentionDays: 90,
    verifyOn: true, identifyOn: true, autoPrune: true, maxRows: 50000,
  };

  // The citation-checks toggle: on by default for the shots; open the harness
  // with ?checksoff to exercise the Bing-only state (screen always exists).
  if (window.AgentimusData && window.AgentimusData.settings) {
    window.AgentimusData.settings.enable_visibility = !/checksoff/.test(window.location.search);
  }

  // The setup wizard: open with ?wizard to run the full first-run flow
  // (welcome → steps → celebration → proof). The proof's "visit" lands ~8s
  // after the first log poll (see the /activity/log branch below), so the
  // success screen demos itself; add &local to see the non-public branch.
  // A data.js captured on 1.33+ carries askAi (icons included); the fallback
  // here only keeps an older capture usable.
  if (/[?&]wizard/.test(window.location.search) && window.AgentimusData) {
    window.AgentimusData.onboarded = false;
    var wizAsk = window.AgentimusData.askAi || {
      assistants: [
        { label: 'ChatGPT', href: 'https://chatgpt.com/?q=demo', icon: '', agents: ['ChatGPT-User'] },
        { label: 'Claude', href: 'https://claude.ai/new?q=demo', icon: '', agents: ['Claude-User'] },
        { label: 'Perplexity', href: 'https://www.perplexity.ai/search?q=demo', icon: '', agents: ['Perplexity-User'] },
        { label: 'Grok', href: 'https://grok.com/?q=demo', icon: '', agents: ['Grok'] },
      ],
    };
    wizAsk.public = !/[?&]local/.test(window.location.search);
    window.AgentimusData.askAi = wizAsk;
    // &local also previews the score card's calm "Not public yet" state.
    if (!wizAsk.public && window.AgentimusData.score) {
      window.AgentimusData.score.blocked = true;
    }
    // &discourage: WordPress's "Discourage search engines" is on — the review
    // step should offer the guided one-tick fix.
    if (/[?&]discourage/.test(window.location.search) && Array.isArray(window.AgentimusData.readiness)) {
      window.AgentimusData.readiness.forEach(function (r) { if (r.id === 'public') { r.status = 'fail'; } });
    }
    // &manytypes: a plugin-heavy site — exercises step 2's "Show N more" fold.
    if (/[?&]manytypes/.test(window.location.search)) {
      var wizPts = window.AgentimusData.postTypes = window.AgentimusData.postTypes || [];
      ['Products', 'Courses', 'Lessons', 'Events', 'Recipes', 'Portfolios', 'Testimonials', 'Docs', 'Forms', 'Popups'].forEach(function (label) {
        wizPts.push({ slug: label.toLowerCase(), label: label, source: 'Demo Plugin' });
      });
    }
  }

  // Canned Bing summary for the AI Visibility screen's Found by AI Search card:
  // a rising index trend and one robots conflict, so the pin renders too.
  window.__BING__ = {
    connected: true, siteUrl: 'https://example.com/', hasMsvalidate: true,
    connectedAt: 0, lastError: '', days: 30,
    totals: { inIndex: 141, crawledLatest: 38, crawlErrors: 7, blockedByRobots: 12 },
    trend: (function () {
      var out = [];
      for (var i = 29; i >= 0; i--) {
        var d = new Date(Date.now() - i * 86400000);
        var crawled = 22 + ((i * 7) % 17);
        var errs = i < 5 ? 1 : (i % 9 === 0 ? 2 : 0);
        out.push({
          date: d.toISOString().slice(0, 10),
          inIndex: 141 - Math.round(i * 0.8),
          crawled: crawled,
          ok: crawled - errs - 2,
          redirects: 2,
          clientErrors: errs,
          serverErrors: i === 3 ? 1 : 0,
          blockedByRobots: 0,
        });
      }
      return out;
    })(),
    conflicts: [
      {
        id: 'bing-robots-blocked', level: 'warn',
        title: 'Bing reports pages blocked by robots.txt, but your policy welcomes search',
        body: 'Bing says 12 of your pages are closed to it by robots.txt. Your site policy says search crawlers are welcome — so something in robots.txt is saying more than you chose. Agentimus writes your robots.txt: check for another plugin or a manual rule adding lines. Once robots.txt opens up, this warning clears with Bing’s next numbers.',
        url: 'https://example.com/robots.txt',
      },
    ],
  };

  (function () {
    window.fetch = function (u) {
      u = String(u);
      var body = '{}';
      // The wizard's done screen fetches the live llms.txt to show it. Plain
      // text, built from the captured identity so the highlights land.
      if (u.indexOf('/llms.txt') > -1) {
        // Mirrors the REAL LlmsText shape: boilerplate paragraphs first, the
        // owner's words down in ## About — so the wizard's excerpt splice
        // (title + ⋯ + About) is exercised, not just the happy first lines.
        var wizId = (((window.AgentimusData || {}).settings || {}).identity) || {};
        var llms = '# ' + (wizId.name || 'This site') + '\n\n'
          + 'A WordPress site. Plain-text and markdown versions of any page are available by appending `.md` to its URL.\n\n'
          + "A machine-readable discovery manifest of this site's agent endpoints, capabilities, and identity is at [/.well-known/discovery.json](https://example.com/.well-known/discovery.json).\n\n"
          + '## About\n\n'
          + (wizId.about || 'What this site is about.') + '\n\n'
          + 'Topics: ' + ((wizId.expertise || []).join(', ') || 'WordPress') + '\n';
        return Promise.resolve(new Response(llms, { status: 200, headers: { 'Content-Type': 'text/plain' } }));
      }
      if (u.indexOf('/bing/summary') > -1 || u.indexOf('/bing/refresh') > -1) body = JSON.stringify(Object.assign({}, window.__BING__, { lastPollAt: Math.floor(Date.now() / 1000) - 7200 }));
      else if (u.indexOf('/agent-access') > -1) body = JSON.stringify(window.__AGENT_ACCESS__ || {});
      else if (u.indexOf('/cloudflare/summary') > -1) body = JSON.stringify(Object.assign({}, window.__EDGE__, { lastPollAt: Math.floor(Date.now() / 1000) - 1500 }));
      else if (u.indexOf('/cloudflare/refresh') > -1) body = JSON.stringify(Object.assign({}, window.__EDGE__, { lastPollAt: Math.floor(Date.now() / 1000) }));
      else if (u.indexOf('/visibility/config') > -1) body = JSON.stringify({ config: { targets: [] }, aiAvailable: false, lastRunAt: '' });
      else if (u.indexOf('/visibility/dashboard') > -1) body = JSON.stringify({ dashboard: { products: [] }, running: false });
      // Settings saves must ECHO the settings back — the app snapshots the
      // response, and an empty body would poison every dirty-check after it.
      else if (u.indexOf('/settings') > -1) body = JSON.stringify({ settings: (window.AgentimusData || {}).settings || {} });
      else if (u.indexOf('/activity/log/facets') > -1) body = JSON.stringify({ agents: [], endpoints: [], networks: ['OpenAI'] });
      else if (u.indexOf('/activity/log') > -1) {
        var wizLog = window.__LOG__ || {};
        // ?wizard: after ~8s of watching, a fresh ChatGPT visit "lands" — newer
        // than every canned row, so the proof screen's baseline check passes.
        if (/[?&]wizard/.test(window.location.search)) {
          if (!window.__WIZ_LOG_FIRST__) window.__WIZ_LOG_FIRST__ = Date.now();
          if (Date.now() - window.__WIZ_LOG_FIRST__ > 8000) {
            wizLog = Object.assign({}, wizLog, {
              rows: [{
                endpoint: 'llms.txt', agent: 'ChatGPT',
                ua: 'Mozilla/5.0 (compatible; ChatGPT-User/1.0; +https://openai.com/bot)',
                network: 'openai.com', verdict: 1, signer: '', refused: false,
                at: new Date().toISOString(),
              }].concat(wizLog.rows || []),
            });
          }
        }
        body = JSON.stringify(wizLog);
      }
      else if (u.indexOf('/activity') > -1) body = JSON.stringify(window.__ACTIVITY__ || {});
      return Promise.resolve(new Response(body, { status: 200, headers: { 'Content-Type': 'application/json' } }));
    };
  })();
</script>
</head>
<body class="wp-admin">
  <div id="wpwrap"><div id="wpcontent">
    <div class="wrap"><div id="agentimus-app"></div></div>
  </div></div>
  <script src="../../assets/admin/app.js"></script>
</body>
</html>
