# Jekyll config for the Agentimus documentation site (GitHub Pages).
# Served from the /docs folder on the default branch, themed with Just-the-Docs.

title: Agentimus
description: >-
  Make your WordPress site legible to AI assistants and agents — the official
  Agentimus documentation: user manual and developer reference.

# Just-the-Docs, pulled in as a remote theme (no local build needed on GitHub Pages).
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Project site lives under /agentimus (https://heera.github.io/agentimus/).
url: "https://heera.github.io"
baseurl: "/agentimus"

# Brand + navigation.
color_scheme: agentimus
search_enabled: true
search:
  heading_level: 2
  previews: 3
heading_anchors: true

aux_links:
  "GitHub ↗": "https://github.com/heera/agentimus"
  "heera.it ↗": "https://heera.it"
aux_links_new_tab: true

# Footer.
last_edit_timestamp: false
back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Built and maintained by <a href="https://heera.it">Sheikh Heera</a>.
  Agentimus is free software (GPL-2.0-or-later); this documentation is generated
  from the plugin source — if something here disagrees with the code, the code wins.

# Coloured callout boxes ({: .note }, {: .warning }, {: .tip } in Markdown).
callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Heads up
    color: yellow
  danger:
    title: Important
    color: red

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
